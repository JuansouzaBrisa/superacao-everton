<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca de Animações - Everton</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { background: #0d0d0d; color: white; padding: 20px; font-family: sans-serif; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: #1a1a1a; padding: 15px; border-radius: 10px; border: 1px solid #333; }
        model-viewer { width: 100%; height: 200px; }
    </style>
</head>
<body>
    <h1>Biblioteca de Emoções do Everton</h1>
    <a href="index.html" style="color: #00b4d8;">← Voltar ao sistema</a>
    <div class="grid">
        <div class="card"><h3>Chorando</h3><model-viewer src="Crying.glb" autoplay camera-controls></model-viewer></div>
        <div class="card"><h3>Capoeira</h3><model-viewer src="Capoeira.glb" autoplay camera-controls></model-viewer></div>
        <div class="card"><h3>Aquecimento</h3><model-viewer src="Warming Up.glb" autoplay camera-controls></model-viewer></div>
        <div class="card"><h3>Parado Triste</h3><model-viewer src="Sad Idle.glb" autoplay camera-controls></model-viewer></div>
    </div>
</body>
</html>
