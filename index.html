<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Desafio de Superação - Everton Luidy</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        /* (Mantenha o mesmo CSS anterior aqui para não quebrar o layout) */
        body { background-color: #0d0d0d; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; }
        .container { background: #141414; padding: 40px; border-radius: 20px; border: 1px solid #0077b6; text-align: center; width: 100%; max-width: 500px; }
        #pet-container { width: 100%; height: 350px; margin-bottom: 20px; }
        .link-animacoes { display: block; margin-top: 20px; color: #00b4d8; text-decoration: none; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Everton Luidy</h1>
        <div id="pet-container">
            <model-viewer id="mascote-3d" src="Sad Idle.glb" autoplay auto-rotate camera-controls style="width: 100%; height: 100%; background: transparent;"></model-viewer>
        </div>
        <p>Clique no boneco para ver o drama!</p>
        <a href="animacoes.html" class="link-animacoes">Ir para a biblioteca de animações</a>
    </div>

    <script>
        const mascote = document.getElementById('mascote-3d');
        mascote.addEventListener('mousedown', () => {
            mascote.src = 'Crying.glb';
            setTimeout(() => { mascote.src = 'Sad Idle.glb'; }, 4000);
        });
    </script>
</body>
</html>
