<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de Superação - Everton</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 1s ease;
        }

        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.15);
            text-align: center;
            max-width: 500px;
            width: 100%;
            transition: all 1s ease;
        }

        .heart {
            font-size: 3rem;
            margin-bottom: 10px;
            display: inline-block;
        }

        h1 {
            color: #ff4d6d;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #6c757d;
            font-size: 1rem;
            margin-bottom: 30px;
        }

        /* Botão de Meta (Aparece no dia 600 e continua nos próximos) */
        .meta-btn {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
            margin-bottom: 25px;
            transition: transform 0.2s;
            animation: pulse 2s infinite;
        }
        .meta-btn:hover { transform: scale(1.05); }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 109, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 77, 109, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 109, 0); }
        }

        /* Grid do Cronômetro */
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .timer-box {
            background: #fff0f3;
            padding: 15px 10px;
            border-radius: 12px;
            border: 1px solid #ffccd5;
        }

        .time-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ff4d6d;
            display: block;
        }

        .time-label {
            font-size: 0.75rem;
            color: #a2a2a2;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .message-area {
            min-height: 50px;
            font-style: italic;
            color: #595959;
            padding: 10px;
            border-left: 3px solid #ff4d6d;
            background: #fff8f9;
            border-radius: 0 8px 8px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #adb5bd;
        }

        /* --- 🎬 ANIMAÇÃO DE SOLUÇO DO BONECO (CSSAtivo) --- */
        @keyframes sadSobbing {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-6px) rotate(-1.5deg); }
            50% { transform: translateY(0) rotate(1.5deg); }
            75% { transform: translateY(-3px) rotate(-0.5deg); }
        }

        /* --- ESTILOS DO QUIZ / MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal {
            background: white; padding: 30px; border-radius: 15px;
            max-width: 400px; width: 90%; text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
        }
        .modal h3 { margin-bottom: 20px; color: #333; font-size: 1.25rem; line-height: 1.4; }
        .quiz-btns { display: flex; gap: 10px; justify-content: center; }
        .quiz-btn {
            padding: 12px 20px; border: none; border-radius: 8px;
            cursor: pointer; font-weight: bold; transition: background 0.2s;
            font-size: 1rem;
        }
        .btn-sim { background: #4cc9f0; color: white; }
        .btn-nao { background: #f72585; color: white; }

        /* MUDANÇA TOTAL DE TEMA (Modo Crise Pós-Quiz) */
        body.mode-600 {
            background: linear-gradient(135deg, #210710 0%, #050103 100%);
        }
        .container.mode-600 {
            background: #14090c;
            color: #fff;
            border: 2px solid #f72585;
            box-shadow: 0 0 30px rgba(247, 37, 133, 0.7);
        }
        .container.mode-600 h1 { color: #f72585; }
        .container.mode-600 .timer-box { background: #240f14; border-color: #f72585; }
        .container.mode-600 .time-number { color: #4cc9f0; }
        .container.mode-600 .message-area { background: #190a0e; color: #eee; border-color: #f72585; }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <!-- O botão usa '>=' para funcionar no dia 600, 601, 602, para sempre -->
        <button class="meta-btn" id="trigger-btn" onclick="openQuiz()" style="display: none;">🎉 EXPANDIR RELATÓRIO DE 600 DIAS 🎉</button>

        <!-- Coração Partido Padrão -->
        <div class="heart" id="heart-icon">💔</div>
        
        <!-- O bonequinho agora possui a animação 'sadSobbing' aplicada diretamente por código! -->
        <img src="everton-3d.png" id="sad-clown" style="display: none; width: 280px; max-width: 100%; height: auto; margin: 0 auto 20px auto; border-radius: 15px; animation: sadSobbing 2.5s ease-in-out infinite; filter: drop-shadow(0 10px 25px rgba(0,0,0,0.7));" alt="Everton de Aniversário">

        <h1 id="main-title">Desafio de Superação</h1>
        <div class="subtitle" id="main-subtitle">"Totalmente superado" da Ana Flavia</div>

        <div class="timer-grid">
            <div class="timer-box">
                <span class="time-number" id="days">00</span>
                <span class="time-label">Dias</span>
            </div>
            <div class="timer-box">
                <span class="time-number" id="hours">00</span>
                <span class="time-label">Horas</span>
            </div>
            <div class="timer-box">
                <span class="time-number" id="minutes">00</span>
                <span class="time-label">Min</span>
            </div>
            <div class="timer-box">
                <span class="time-number" id="seconds">00</span>
                <span class="time-label">Seg</span>
            </div>
        </div>

        <div class="message-area" id="dynamic-message">
            Calculando o nível do apego...
        </div>

        <div class="footer">
            Início do desafio: 08/10/2024 às 18:00
        </div>
    </div>

    <!-- Interface do Quiz -->
    <div class="modal-overlay" id="quiz-modal">
        <div class="modal">
            <h3>Everton, responda com o coração...<br>Você realmente superou a Ana Flávia?</h3>
            <div class="quiz-btns">
                <button class="quiz-btn btn-sim" onclick="quizAnswer(true)">Sim, superei!</button>
                <button class="quiz-btn btn-nao" onclick="quizAnswer(false)">Não, confesso...</button>
            </div>
        </div>
    </div>

    <script>
        const startDate = new Date('2024-10-08T18:00:00');

        const messages = [
            "Ele jura que nem lembra mais dela...",
            "Superação nível: Olhando os stories no fake.",
            "A Ana Flavia segue vivendo no aluguel grátis na mente dele.",
            "Diz que superou, mas ouve a playlist triste de madrugada.",
            "Bloqueou em tudo, mas decorou o @."
        ];

        const special600Messages = [
            "Parabéns pelos mais de 600 dias de fingimento!",
            "600+ dias e o aluguel na mente continua custando R$ 0,00.",
            "O aniversário passou, mas o choro na academia continua firme.",
            "Comunicado oficial: A superação foi cancelada por tempo indeterminado.",
            "600 dias fingindo costume. Nem a Globo contrata um ator desse."
        ];

        let forceMode600 = false;

        function updateTimer() {
            const now = new Date();
            const difference = now - startDate;

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

            // Mudança crucial: usando '>=' garante que o botão continua aparecendo após o dia 600
            if (days >= 600 && !forceMode600) {
                document.getElementById('trigger-btn').style.display = 'inline-block';
            }

            // Atualiza os textos dinâmicos de 10 em 10 segundos
            if (seconds % 10 === 0) {
                const currentPool = (days >= 600 || forceMode600) ? special600Messages : messages;
                const randomIndex = Math.floor(Math.random() * currentPool.length);
                document.getElementById('dynamic-message').textContent = currentPool[randomIndex];
            }
        }

        function openQuiz() {
            document.getElementById('quiz-modal').classList.add('active');
        }

        function quizAnswer(answeredYes) {
            document.getElementById('quiz-modal').classList.remove('active');
            
            if (answeredYes) {
                alert("❌ DETECTOR DE MENTIRAS: Erro crítico! Quem superou de verdade não entra em link de cronômetro. Parando a nhenhenhe em 3, 2, 1...");
            } else {
                alert("🩹 Dignidade recuperada pela honestidade! Mas aceita que 600 dias é só o começo do processo.");
            }

            transformInterface();
        }

        function transformInterface() {
            forceMode600 = true;
            
            document.body.classList.add('mode-600');
            document.getElementById('main-container').classList.add('mode-600');
            
            document.getElementById('trigger-btn').style.display = 'none';
            document.getElementById('heart-icon').style.display = 'none';
            document.getElementById('sad-clown').style.display = 'block'; // Ativa a imagem animada
            
            document.getElementById('main-title').textContent = "🎈 MARCA DOS 600+ DIAS 🎈";
            document.getElementById('main-subtitle').innerHTML = "Parabéns, Everton!<br>O aniversário já passou, mas o luto técnico segue ativo.";
            
            const randomIndex = Math.floor(Math.random() * special600Messages.length);
            document.getElementById('dynamic-message').textContent = special600Messages[randomIndex];
        }

        updateTimer();
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
