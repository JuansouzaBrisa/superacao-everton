name: Merge GLB Animations

on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências localmente
        run: |
          npm init -y
          npm install @gltf-transform/core @gltf-transform/extensions @gltf-transform/functions meshoptimizer

      - name: Rodar script de merge
        run: node merge-glb.mjs

      - name: Commit e push do mascote.glb
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mascote.glb
          git commit -m "chore: merge animações em mascote.glb [skip ci]"
          git push
