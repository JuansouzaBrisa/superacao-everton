name: Merge GLB Animations

on:
  workflow_dispatch: # Roda manualmente pelo botão no GitHub

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar gltf-transform CLI
        run: npm install -g @gltf-transform/cli

      - name: Instalar meshoptimizer
        run: npm install -g meshoptimizer

      - name: Mesclar animações em um único GLB
        run: node merge-glb.mjs

      - name: Commit e push do mascote.glb
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mascote.glb
          git commit -m "chore: merge animações em mascote.glb [skip ci]"
          git push
